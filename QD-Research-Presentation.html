<body class="h-screen flex flex-col overflow-hidden bg-[#F0F9FF] text-[#0F172A]">

  <!-- Top Progress Bar -->
  <div class="w-full bg-[#E0F2FE] h-1.5 z-50 shrink-0">
    <div id="progressBar" class="bg-gradient-to-r from-[#38BDF8] via-[#0EA5E9] to-[#0284C7] h-full w-0 transition-all duration-300"></div>
  </div>

  <!-- Top Navigation & Control Header -->
  <header class="bg-white/95 backdrop-blur-md border-b border-sky-200 px-3 sm:px-5 py-2.5 flex items-center justify-between z-40 shrink-0 shadow-xs">
    <!-- Left: Sidebar Toggle & Brand -->
    <div class="flex items-center gap-2.5 sm:gap-3 min-w-0">
      <button id="toggleSidebarBtn" title="ซ่อน/แสดง สารบัญสไลด์" class="p-2.5 rounded-xl bg-[#F0F9FF] hover:bg-[#E0F2FE] text-[#0284C7] border border-sky-200 transition shrink-0">
        <i class="fa-solid fa-bars-staggered text-base"></i>
      </button>
      <div class="flex items-center gap-2 min-w-0">
        <span class="bg-gradient-to-r from-[#0284C7] to-[#0EA5E9] text-white text-[11px] sm:text-xs px-2.5 py-1 rounded-full font-heading font-semibold tracking-wide shrink-0 shadow-xs">
          QD RESEARCH
        </span>
        <h1 class="text-xs sm:text-sm md:text-base font-heading font-bold text-[#0F172A] truncate">
          การวิจัยเชิงคุณภาพแบบพรรณนา
        </h1>
      </div>
    </div>

    <!-- Center: Current Module Indicator -->
    <div class="hidden xl:flex items-center gap-2 px-3.5 py-1.5 bg-[#F0F9FF] rounded-full border border-sky-200 text-xs text-[#0284C7] font-heading font-medium">
      <i class="fa-solid fa-layer-group text-[#0EA5E9]"></i>
      <span id="moduleBadge">หมวด 1: บทนำและรากฐานแนวคิด</span>
    </div>

    <!-- Right: Action Toolbar -->
    <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
      <!-- Download HTML File Button -->
      <button id="downloadHtmlBtn" onclick="downloadSelfContainedHtml()" title="ดาวน์โหลดไฟล์ .HTML เพื่ออัปโหลดสร้างลิงก์แชร์" class="flex items-center gap-1.5 px-2.5 sm:px-3.5 py-2 bg-gradient-to-r from-[#0284C7] to-[#0EA5E9] hover:from-[#0369A1] hover:to-[#0284C7] text-white text-xs font-heading font-semibold rounded-xl transition shadow-sm">
        <i class="fa-solid fa-cloud-arrow-down"></i>
        <span class="hidden md:inline">ดาวน์โหลดไฟล์ .HTML</span>
      </button>

      <!-- Copy Direct Slide Link Button -->
      <button id="copyLinkBtn" onclick="copyCurrentSlideLink()" title="คัดลอกลิงก์หน้าสไลด์ปัจจุบัน (#slide=N)" class="flex items-center gap-1.5 px-2.5 sm:px-3 py-2 bg-[#F0F9FF] hover:bg-[#E0F2FE] text-[#0284C7] text-xs font-heading font-semibold rounded-xl transition border border-sky-200">
        <i class="fa-solid fa-link"></i>
        <span class="hidden sm:inline">คัดลอกลิงก์</span>
      </button>

      <!-- Grid Overview Button -->
      <button id="gridModalBtn" onclick="openGridModal()" title="มุมมองภาพรวมทั้งหมด 49 สไลด์" class="flex items-center gap-1.5 px-2.5 sm:px-3 py-2 bg-white hover:bg-[#F0F9FF] text-[#0F172A] text-xs font-heading font-medium rounded-xl transition border border-sky-200">
        <i class="fa-solid fa-grip text-[#0284C7]"></i>
        <span class="hidden lg:inline">ภาพรวม</span>
      </button>

      <!-- Fullscreen Button -->
      <button id="fullscreenBtn" onclick="toggleFullscreen()" title="ขยายเต็มหน้าจอ" class="p-2 rounded-xl bg-white hover:bg-[#F0F9FF] text-[#0284C7] text-xs transition border border-sky-200">
        <i id="fullscreenIcon" class="fa-solid fa-expand"></i>
      </button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <div class="flex-grow flex relative overflow-hidden">

    <!-- Collapsible Sidebar Table of Contents -->
    <aside id="sidebar" class="w-72 sm:w-80 bg-white border-r border-sky-200 flex flex-col transition-all duration-300 z-30 shrink-0 absolute md:relative h-full shadow-lg md:shadow-none -translate-x-full md:translate-x-0">
      <!-- Live Keyword Search Filter -->
      <div class="p-3 bg-[#F0F9FF]/70 border-b border-sky-200">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-[#0284C7] text-xs"></i>
          <input type="text" id="searchInput" oninput="filterSlides()" placeholder="ค้นหาหัวข้อหรือคำสำคัญ..." class="w-full bg-white text-[#0F172A] placeholder-slate-400 text-xs rounded-xl pl-8 pr-7 py-2 border border-sky-200 focus:outline-none focus:ring-2 focus:ring-[#38BDF8]">
          <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2.5 top-2 text-slate-400 hover:text-[#0284C7] text-xs">
            <i class="fa-solid fa-circle-xmark"></i>
          </button>
        </div>
      </div>

      <!-- Slide List -->
      <div id="slideList" class="flex-grow overflow-y-auto p-2.5 space-y-1">
        <!-- Populated dynamically via JS -->
      </div>

      <!-- Sidebar Footer -->
      <div class="p-3 bg-[#F0F9FF] border-t border-sky-200 text-center text-[11px] text-slate-500 font-medium">
        หลักสูตรระดับปริญญาโท • ทั้งหมด 49 สไลด์
      </div>
    </aside>

    <!-- Mobile Backdrop for Sidebar -->
    <div id="sidebarBackdrop" onclick="closeMobileSidebar()" class="fixed inset-0 bg-slate-900/30 backdrop-blur-xs z-20 hidden md:hidden"></div>

    <!-- Main Slide Stage -->
    <main id="slideStage" class="flex-grow flex flex-col justify-between items-center p-3 sm:p-6 md:p-8 bg-gradient-to-br from-[#F0F9FF] via-[#E0F2FE]/60 to-[#F0F9FF] overflow-y-auto relative w-full">
      
      <!-- Slide Card Container -->
      <div class="w-full max-w-5xl my-auto flex flex-col justify-center">
        <article id="slideCard" class="bg-white rounded-3xl border border-sky-200/90 academic-card-shadow p-5 sm:p-8 md:p-10 text-[#0F172A] min-h-[500px] sm:min-h-[550px] flex flex-col justify-between relative overflow-hidden">
          
          <!-- Decorative Top Soft Blue Accent Strip -->
          <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-[#38BDF8] via-[#0EA5E9] to-[#0284C7]"></div>

          <!-- Dynamic Slide Body -->
          <div id="slideContent" class="flex-grow flex flex-col justify-center">
            <!-- Rendered by JS -->
          </div>

          <!-- Slide Citation & Page Number Footer -->
          <div class="mt-6 pt-3.5 border-t border-sky-100 flex flex-wrap justify-between items-center gap-2 text-xs">
            <div id="slideReference" class="flex items-center gap-2">
              <!-- Rendered by JS -->
            </div>
            <div id="slideNumberBadge" class="bg-[#F0F9FF] text-[#0284C7] font-heading font-semibold px-3.5 py-1 rounded-full border border-sky-200 shrink-0">
              <!-- Rendered by JS -->
            </div>
          </div>

        </article>
      </div>

    </main>

  </div>

  <!-- Bottom Presentation Control Bar -->
  <footer class="bg-white border-t border-sky-200 px-3 sm:px-6 py-2.5 flex items-center justify-between z-40 shrink-0">
    <!-- Previous Button -->
    <button id="prevBtn" onclick="prevSlide()" class="flex items-center gap-2 px-3.5 sm:px-5 py-2.5 bg-[#F0F9FF] hover:bg-[#E0F2FE] disabled:opacity-40 disabled:pointer-events-none text-[#0284C7] rounded-xl transition text-xs sm:text-sm font-heading font-semibold border border-sky-200">
      <i class="fa-solid fa-arrow-left"></i>
      <span>ก่อนหน้า</span>
    </button>

    <!-- Center Counter & Quick Jump -->
    <div class="flex items-center gap-2 sm:gap-3">
      <button onclick="firstSlide()" title="ไปสไลด์แรก (Home)" class="hidden sm:flex items-center justify-center w-9 h-9 rounded-xl bg-[#F0F9FF] hover:bg-[#E0F2FE] text-[#0284C7] border border-sky-200 text-xs transition">
        <i class="fa-solid fa-backward-step"></i>
      </button>

      <div class="flex items-center gap-2 bg-[#F0F9FF] px-3.5 py-1.5 rounded-xl border border-sky-200 text-xs sm:text-sm font-heading">
        <span class="text-slate-500 hidden sm:inline">สไลด์</span>
        <input type="number" id="slideInput" min="1" max="49" value="1" onchange="jumpToInputValue(this.value)" aria-label="หมายเลขสไลด์" class="w-12 bg-white text-[#0284C7] font-bold text-center rounded-lg border border-sky-300 py-0.5 focus:outline-none focus:ring-2 focus:ring-[#38BDF8]">
        <span class="text-slate-600 font-semibold">/ 49</span>
      </div>

      <button onclick="lastSlide()" title="ไปสไลด์สุดท้าย (End)" class="hidden sm:flex items-center justify-center w-9 h-9 rounded-xl bg-[#F0F9FF] hover:bg-[#E0F2FE] text-[#0284C7] border border-sky-200 text-xs transition">
        <i class="fa-solid fa-forward-step"></i>
      </button>
    </div>

        content: `

    // =========================================================================
    // STATE MANAGEMENT & INITIALIZATION
    // =========================================================================
    let currentSlide = 0;

    document.addEventListener("DOMContentLoaded", () => {
      // Save pristine HTML source before dynamic DOM modifications
      pristineHtmlSource = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

      // Handle initial #slide=N hash
      parseHashAndJump(false);

      renderSidebar();
      renderSlide(currentSlide);
      renderGridModal();
      setupControls();

      // Listen for URL hash changes
      window.addEventListener("hashchange", () => {
        parseHashAndJump(true);
      });
    });

    function parseHashAndJump(shouldRender) {
      const hash = window.location.hash;
      if (hash && hash.startsWith("#slide=")) {
        const slideNum = parseInt(hash.replace("#slide=", ""), 10);
        if (!isNaN(slideNum) && slideNum >= 1 && slideNum <= slidesData.length) {
          currentSlide = slideNum - 1;
          if (shouldRender) {
            renderSlide(currentSlide);
          }
        }
      }
    }

    // =========================================================================
    // RENDER SLIDE, SIDEBAR & GRID THUMBNAILS
    // =========================================================================
    function renderSlide(index) {
      if (index < 0 || index >= slidesData.length) return;
      currentSlide = index;

      const data = slidesData[index];

      // Update Header Module Badge
      document.getElementById("moduleBadge").innerText = data.module;

      // Update Slide Card Body
      const slideContent = document.getElementById("slideContent");
      slideContent.classList.remove("fade-slide-in");
      void slideContent.offsetWidth; // trigger reflow for animation
      slideContent.classList.add("fade-slide-in");

      if (data.isCover) {
        slideContent.innerHTML = data.content;
      } else {
        slideContent.innerHTML = `
          <div class="space-y-5">
            <div class="border-b border-sky-100 pb-3.5">
              <span class="inline-block text-xs font-heading font-semibold text-[#0284C7] bg-[#F0F9FF] px-3 py-1 rounded-full border border-sky-200 mb-2">
                ${data.module}
              </span>
              <h2 class="text-xl sm:text-2xl md:text-3xl font-heading font-bold text-[#0F172A] leading-snug">
                ${data.title}
              </h2>
            </div>
            <div>${data.content}</div>
          </div>
        `;
      }

      // Update Citation Badge in Footer
      const refContainer = document.getElementById("slideReference");
      if (data.reference) {
        refContainer.innerHTML = `
          <span class="inline-flex items-center gap-1.5 bg-[#F0F9FF] text-[#0369A1] px-3 py-1 rounded-full border border-sky-200 font-medium text-[11px] sm:text-xs">
            <i class="fa-solid fa-bookmark text-[#0EA5E9]"></i>
            <span>${data.reference}</span>
          </span>
        `;
      } else {
        refContainer.innerHTML = `
          <span class="inline-flex items-center gap-1.5 text-slate-400 text-xs">
            <i class="fa-solid fa-book-open text-[#38BDF8]"></i>
            <span>Qualitative Descriptive Research (QD)</span>
          </span>
        `;
      }

      // Update Slide Counter Badge
      document.getElementById("slideNumberBadge").innerText = `${data.id} / ${slidesData.length}`;

      // Update Progress Bar & Numeric Input
      const progressPct = ((index + 1) / slidesData.length) * 100;
      document.getElementById("progressBar").style.width = `${progressPct}%`;
      document.getElementById("slideInput").value = index + 1;

      // Update Prev/Next Button States
      document.getElementById("prevBtn").disabled = index === 0;
      document.getElementById("nextBtn").disabled = index === slidesData.length - 1;

      // Sync Sidebar Active Highlight
      updateSidebarActiveState(index);

      // Update URL Hash without adding history clutter
      try {
        history.replaceState(null, "", `#slide=${index + 1}`);
      } catch (e) {
        window.location.hash = `slide=${index + 1}`;
      }
    }

    function renderSidebar() {
      const container = document.getElementById("slideList");
      container.innerHTML = "";
      let lastModule = "";

      slidesData.forEach((slide, idx) => {
        if (slide.module !== lastModule) {
          lastModule = slide.module;
          const header = document.createElement("div");
          header.className = "sidebar-group-header text-[11px] font-heading font-bold text-[#0284C7] uppercase tracking-wider px-3 pt-3 pb-1 mt-1 border-t border-sky-100 first:border-t-0 first:pt-1";
          header.innerText = lastModule;
          container.appendChild(header);
        }

        const btn = document.createElement("button");
        btn.id = `sidebar-item-${idx}`;
        btn.onclick = () => {
          jumpToSlide(idx);
          closeMobileSidebar();
        };
        btn.className = "w-full text-left px-3 py-2 rounded-xl text-xs font-body transition flex items-center gap-2.5";
        btn.innerHTML = `
          <span class="w-6 h-6 rounded-lg flex items-center justify-center font-heading font-bold text-[11px] shrink-0 sidebar-num">${slide.id}</span>
          <span class="truncate">${slide.title}</span>
        `;
        container.appendChild(btn);
      });

      updateSidebarActiveState(currentSlide);
    }

    function updateSidebarActiveState(activeIndex) {
      slidesData.forEach((_, idx) => {
        const btn = document.getElementById(`sidebar-item-${idx}`);
        if (!btn) return;
        const badge = btn.querySelector(".sidebar-num");

        if (idx === activeIndex) {
          btn.className = "w-full text-left px-3 py-2 rounded-xl text-xs font-body transition flex items-center gap-2.5 bg-gradient-to-r from-[#0284C7] to-[#0EA5E9] text-white font-semibold shadow-xs";
          if (badge) badge.className = "w-6 h-6 rounded-lg flex items-center justify-center font-heading font-bold text-[11px] shrink-0 sidebar-num bg-white/20 text-white";
          btn.scrollIntoView({ block: "nearest", behavior: "smooth" });
        } else {
          btn.className = "w-full text-left px-3 py-2 rounded-xl text-xs font-body transition flex items-center gap-2.5 text-[#0F172A] hover:bg-[#F0F9FF] hover:text-[#0284C7]";
          if (badge) badge.className = "w-6 h-6 rounded-lg flex items-center justify-center font-heading font-bold text-[11px] shrink-0 sidebar-num bg-[#F0F9FF] text-[#0284C7] border border-sky-200";
        }
      });
    }

    function renderGridModal() {
      const container = document.getElementById("gridContainer");
      container.innerHTML = "";

      slidesData.forEach((slide, idx) => {
        const card = document.createElement("button");
        card.onclick = () => {
          jumpToSlide(idx);
          closeGridModal();
        };
        card.className = "text-left bg-white hover:bg-[#F0F9FF] border border-sky-200 hover:border-[#0284C7] rounded-2xl p-4 cursor-pointer transition flex flex-col justify-between group h-32 shadow-xs";
        card.innerHTML = `
          <div class="flex justify-between items-center w-full">
            <span class="bg-[#E0F2FE] text-[#0284C7] font-heading font-bold text-[11px] px-2.5 py-0.5 rounded-full">สไลด์ ${slide.id}</span>
            <i class="fa-solid fa-arrow-up-right-from-square text-xs text-[#0EA5E9] opacity-0 group-hover:opacity-100 transition"></i>
          </div>
          <h4 class="text-xs sm:text-sm font-heading font-bold text-[#0F172A] line-clamp-2 group-hover:text-[#0284C7] my-1">
            ${slide.title}
          </h4>
          <span class="text-[11px] text-slate-400 truncate w-full">${slide.module}</span>
        `;
        container.appendChild(card);
      });
    }

    // =========================================================================
    // NAVIGATION, KEYBOARD & TOUCH GESTURES
    // =========================================================================
    function nextSlide() {
      if (currentSlide < slidesData.length - 1) {
        renderSlide(currentSlide + 1);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        renderSlide(currentSlide - 1);
      }
    }

    function jumpToSlide(index) {
      renderSlide(index);
    }

    function jumpToInputValue(val) {
      const num = parseInt(val, 10);
      if (!isNaN(num) && num >= 1 && num <= slidesData.length) {
        jumpToSlide(num - 1);
      } else {
        document.getElementById("slideInput").value = currentSlide + 1;
      }
    }

    function firstSlide() {
      jumpToSlide(0);
    }

    function lastSlide() {
      jumpToSlide(slidesData.length - 1);
    }

    function setupControls() {
      // Keyboard shortcuts
      document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;

        if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
          e.preventDefault();
          nextSlide();
        } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
          e.preventDefault();
          prevSlide();
        } else if (e.key === "Home") {
          e.preventDefault();
          firstSlide();
        } else if (e.key === "End") {
          e.preventDefault();
          lastSlide();
        } else if (e.key === "Escape") {
          closeGridModal();
          closeMobileSidebar();
        }
      });

      // Sidebar Toggle (Desktop & Mobile)
      document.getElementById("toggleSidebarBtn").addEventListener("click", () => {
        const sidebar = document.getElementById("sidebar");
        const backdrop = document.getElementById("sidebarBackdrop");
        const isMobile = window.innerWidth < 768;

        if (isMobile) {
          const isHidden = sidebar.classList.contains("-translate-x-full");
          if (isHidden) {
            sidebar.classList.remove("-translate-x-full");
            backdrop.classList.remove("hidden");
          } else {
            sidebar.classList.add("-translate-x-full");
            backdrop.classList.add("hidden");
          }
        } else {
          sidebar.classList.toggle("md:hidden");
        }
      });

      // Touch Swipe Support for Mobile/Tablet
      let touchStartX = 0;
      let touchEndX = 0;
      const stage = document.getElementById("slideStage");

      stage.addEventListener("touchstart", (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      stage.addEventListener("touchend", (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) > 55) {
          if (diff > 0) {
            nextSlide();
          } else {
            prevSlide();
          }
        }
      }, { passive: true });
    }

    function closeMobileSidebar() {
      if (window.innerWidth < 768) {
        document.getElementById("sidebar").classList.add("-translate-x-full");
        document.getElementById("sidebarBackdrop").classList.add("hidden");
      }
    }

    // =========================================================================
    // SHARE LINK & DOWNLOAD SELF-CONTAINED HTML FILE
    // =========================================================================
    function copyCurrentSlideLink() {
      const baseUrl = window.location.href.split("#")[0];
      const shareUrl = `${baseUrl}#slide=${currentSlide + 1}`;

      const tempInput = document.createElement("textarea");
      tempInput.value = shareUrl;
      tempInput.style.position = "fixed";
      tempInput.style.opacity = "0";
      document.body.appendChild(tempInput);
      tempInput.select();

      try {
        document.execCommand("copy");
        showToast(`คัดลอกลิงก์สไลด์ที่ ${currentSlide + 1} เรียบร้อยแล้ว!`);
      } catch (err) {
        showToast(`ลิงก์หน้านี้คือ: #slide=${currentSlide + 1}`);
      } finally {
        document.body.removeChild(tempInput);
      }
    }

    function downloadSelfContainedHtml() {
      try {
        const htmlContent = pristineHtmlSource || ("<!DOCTYPE html>\n" + document.documentElement.outerHTML);
        const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "QD-Research-Presentation.html";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showToast("ดาวน์โหลดไฟล์ QD-Research-Presentation.html สำเร็จ!");
      } catch (err) {
        showToast("เกิดข้อผิดพลาดในการดาวน์โหลดไฟล์");
      }
    }

    function toggleFullscreen() {
      const icon = document.getElementById("fullscreenIcon");
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          icon.className = "fa-solid fa-compress";
        }).catch(() => {
          showToast("เบราว์เซอร์ไม่รองรับโหมดเต็มหน้าจอในหน้าต่างนี้");
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().then(() => {
            icon.className = "fa-solid fa-expand";
          });
        }
      }
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toastMsg").innerText = msg;
      toast.classList.remove("opacity-0", "pointer-events-none");
      toast.classList.add("opacity-100");
      setTimeout(() => {
        toast.classList.remove("opacity-100");
        toast.classList.add("opacity-0", "pointer-events-none");
      }, 3200);
    }

    // =========================================================================
    // GRID MODAL & KEYWORD SEARCH FILTER
    // =========================================================================
    function openGridModal() {
      const modal = document.getElementById("gridModal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeGridModal() {
      const modal = document.getElementById("gridModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    function filterSlides() {
      const input = document.getElementById("searchInput");
      const clearBtn = document.getElementById("clearSearchBtn");
      const query = input.value.trim().toLowerCase();

      if (query.length > 0) {
        clearBtn.classList.remove("hidden");
      } else {
        clearBtn.classList.add("hidden");
      }

      slidesData.forEach((slide, idx) => {
        const item = document.getElementById(`sidebar-item-${idx}`);
        if (!item) return;

        // Strip HTML tags from content for clean text search
        const plainContent = slide.content.replace(/<[^>]*>/g, " ").toLowerCase();
        const isMatch =
          slide.title.toLowerCase().includes(query) ||
          slide.module.toLowerCase().includes(query) ||
          slide.reference.toLowerCase().includes(query) ||
          plainContent.includes(query) ||
          String(slide.id) === query;

        item.style.display = isMatch ? "flex" : "none";
      });
    }

    function clearSearch() {
      document.getElementById("searchInput").value = "";
      filterSlides();
    }
  </script>
